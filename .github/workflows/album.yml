name: Update photo album
on:
  push:
    branches: [main]
    paths-ignore: ['album_state.json', 'public/pages/**', 'public/album.json']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: photo-album
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test immutable layouts
        run: python -m unittest -v
      - name: Fetch new photos and generate pages
        run: python build_album.py
      - name: Save permanent layout and page images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add album_state.json public
          if ! git diff --cached --quiet; then
            git commit -m "Append new album photos [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy album
        id: deployment
        uses: actions/deploy-pages@v4
