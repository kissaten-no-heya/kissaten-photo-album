<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>喫茶店の部屋 · Photo Album</title>
<style>body{margin:0;background:#e8e1d4;color:#3f382f;font-family:system-ui,sans-serif}header{max-width:1100px;margin:55px auto 30px;padding:0 24px}h1{font-size:30px;font-weight:500}p,a{color:#6c6151}main{max-width:1100px;margin:auto;padding:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}figure{margin:0}img{width:100%;box-shadow:0 8px 25px #40351d25}figcaption{text-align:center;padding:12px;font-size:12px}@media(max-width:600px){main{grid-template-columns:1fr}}</style>
<header><p>KISSATEN NO HEYA</p><h1>写真のアルバム</h1><p id="status">読み込み中…</p><a href="album.json">VRChat 用 album.json</a></header><main id="pages"></main>
<script>fetch('album.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(a=>{document.getElementById('status').textContent=`${a.photoCount} 枚の思い出 · ${a.pageCount} ページ`;for(const p of a.pages){const f=document.createElement('figure'),i=document.createElement('img'),c=document.createElement('figcaption');i.src=p.url;i.alt=`アルバム ${p.number} ページ`;i.loading='lazy';c.textContent=String(p.number).padStart(2,'0');f.append(i,c);document.getElementById('pages').append(f)}}).catch(()=>document.getElementById('status').textContent='アルバムを読み込めませんでした。しばらくして再読み込みしてください。');</script></html>
